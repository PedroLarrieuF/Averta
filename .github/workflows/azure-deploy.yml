name: Azure Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
      approver:
        description: 'Approver email (required for production)'
        required: false
        type: string

  pull_request:
    branches: [main]
    paths:
      - 'infra/azure/**'
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AZURE_LOCATION: 'eastus'
  BICEP_ROOT: 'infra/azure/bicep'

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/setup-azurecli@v2
        with:
          version: '2.55.0'

      - name: Install Bicep
        run: az bicep install

      - name: Build Bicep
        run: |
          cd ${{ env.BICEP_ROOT }}
          az bicep build --file main.bicep --stdout > /dev/null
          echo "Bicep build successful"

      - name: Validate Bicep Linting
        run: |
          cd ${{ env.BICEP_ROOT }}
          az bicep build --file main.bicep --outfile /tmp/main.json
          echo "Bicep linting passed"

  plan:
    name: Plan Deployment
    needs: validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Set Parameters File
        id: params
        run: |
          if [[ "${{ steps.env.outputs.environment }}" == "production" ]]; then
            echo "file=infra/azure/bicep/environments/production/main.parameters.json" >> $GITHUB_OUTPUT
          else
            echo "file=infra/azure/bicep/environments/staging/main.parameters.json" >> $GITHUB_OUTPUT
          fi

      - name: What-If Deployment
        id: whatif
        run: |
          cd ${{ env.BICEP_ROOT }}

          # Determine resource group name
          if [[ "${{ steps.env.outputs.environment }}" == "production" ]]; then
            RG="rg-averta-production"
          else
            RG="rg-averta-staging"
          fi

          # Run what-if
          OUTPUT=$(az deployment group what-if \
            --resource-group $RG \
            --template-file main.bicep \
            --parameters @${{ steps.params.outputs.file }} \
            --name "whatif-${{ github.run_id }}" \
            --mode Incremental \
            --no-pretty-print \
            --output json)

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.whatif.outputs.result }}`;
            const body = `## 🏗️ Bicep What-If Analysis (Staging)

            \`\`\`json
            ${output}
            \`\`\`

            *Triggered by PR #${{ github.event.number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  apply-staging:
    name: Apply Staging
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Staging
        run: |
          cd ${{ env.BICEP_ROOT }}

          az deployment group create \
            --resource-group rg-averta-staging \
            --template-file main.bicep \
            --parameters @environments/staging/main.parameters.json \
            --name "staging-deploy-${{ github.run_id }}" \
            --mode Incremental

      - name: Verify Deployment
        run: |
          az deployment group show \
            --resource-group rg-averta-staging \
            --name "staging-deploy-${{ github.run_id }}" \
            --query "properties.outputs" \
            --output table

  apply-production:
    name: Apply Production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Approver
        run: |
          if [[ -z "${{ github.event.inputs.approver }}" ]]; then
            echo "::error::Approver email is required for production deployment"
            exit 1
          fi
          echo "Approver: ${{ github.event.inputs.approver }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production
        run: |
          cd ${{ env.BICEP_ROOT }}

          az deployment group create \
            --resource-group rg-averta-production \
            --template-file main.bicep \
            --parameters @environments/production/main.parameters.json \
            --name "production-deploy-${{ github.run_id }}" \
            --mode Incremental

      - name: Verify Deployment
        run: |
          az deployment group show \
            --resource-group rg-averta-production \
            --name "production-deploy-${{ github.run_id }}" \
            --query "properties.outputs" \
            --output table

      - name: Log Deployment
        run: |
          echo "Deployment completed by ${{ github.event.inputs.approver }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployment-log.txt
          cat deployment-log.txt

  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Staging Drift
        run: |
          cd ${{ env.BICEP_ROOT }}

          OUTPUT=$(az deployment group what-if \
            --resource-group rg-averta-staging \
            --template-file main.bicep \
            --parameters @environments/staging/main.parameters.json \
            --name "drift-check-staging-${{ github.run_id }}" \
            --mode Incremental \
            --no-pretty-print \
            --output json)

          CHANGES=$(echo "$OUTPUT" | jq '.changes | length')
          if [[ $CHANGES -gt 0 ]]; then
            echo "::warning::Staging drift detected: $CHANGES changes"
            echo "$OUTPUT" | jq '.changes[] | {resource: .resourceId, change: .changeType, details: .delta}' > drift-staging.json
            cat drift-staging.json
          else
            echo "No drift detected in staging"
          fi

      - name: Check Production Drift
        run: |
          cd ${{ env.BICEP_ROOT }}

          OUTPUT=$(az deployment group what-if \
            --resource-group rg-averta-production \
            --template-file main.bicep \
            --parameters @environments/production/main.parameters.json \
            --name "drift-check-production-${{ github.run_id }}" \
            --mode Incremental \
            --no-pretty-print \
            --output json)

          CHANGES=$(echo "$OUTPUT" | jq '.changes | length')
          if [[ $CHANGES -gt 0 ]]; then
            echo "::warning::Production drift detected: $CHANGES changes"
            echo "$OUTPUT" | jq '.changes[] | {resource: .resourceId, change: .changeType, details: .delta}' > drift-production.json
            cat drift-production.json
          else
            echo "No drift detected in production"
          fi

      - name: Create Drift Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '# 🔍 Weekly Drift Detection Report\n\n';
            body += `**Date:** ${new Date().toISOString().split('T')[0]}\n\n`;

            if (fs.existsSync('drift-staging.json')) {
              const staging = fs.readFileSync('drift-staging.json', 'utf8');
              body += '## ⚠️ Staging Drift Detected\n\n';
              body += '```json\n' + staging + '\n```\n\n';
            } else {
              body += '## ✅ Staging - No Drift\n\n';
            }

            if (fs.existsSync('drift-production.json')) {
              const production = fs.readFileSync('drift-production.json', 'utf8');
              body += '## ⚠️ Production Drift Detected\n\n';
              body += '```json\n' + production + '\n```\n\n';
            } else {
              body += '## ✅ Production - No Drift\n\n';
            }

            body += '---\n*Automated drift detection run*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Drift Detection Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['drift-detection', 'automated']
            });