version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: averta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: averta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: averta-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: averta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: averta-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_DBNAME: averta
      DATABASES_USER: postgres
      DATABASES_PASSWORD: postgres
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "5"
      SERVER_RESET_QUERY: "DISCARD ALL"
      ADMIN_USERS: postgres
      STATS_USERS: postgres
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "6432", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: averta-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@pgbouncer:6432/averta
      - DATABASE_READ_REPLICA_URL=postgresql://postgres:postgres@postgres:5432/averta
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=averta-documents
      - S3_REGION=us-east-1
      - S3_PUBLIC_URL=http://localhost:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=your-super-secret-jwt-key-min-32-chars-long
      - JWT_REFRESH_SECRET_KEY=your-super-secret-refresh-key-min-32-chars-long
      - FRONTEND_URL=http://localhost:3000
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./prisma:/app/prisma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: averta-celery-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@pgbouncer:6432/averta
      - DATABASE_READ_REPLICA_URL=postgresql://postgres:postgres@postgres:5432/averta
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=averta-documents
      - S3_REGION=us-east-1
      - S3_PUBLIC_URL=http://localhost:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=your-super-secret-jwt-key-min-32-chars-long
      - JWT_REFRESH_SECRET_KEY=your-super-secret-refresh-key-min-32-chars-long
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./prisma:/app/prisma
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: averta-celery-beat
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@pgbouncer:6432/averta
      - DATABASE_READ_REPLICA_URL=postgresql://postgres:postgres@postgres:5432/averta
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=your-super-secret-jwt-key-min-32-chars-long
      - JWT_REFRESH_SECRET_KEY=your-super-secret-refresh-key-min-32-chars-long
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./prisma:/app/prisma
    command: celery -A app.core.celery_app beat --loglevel=info

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: averta-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: averta-network