<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f3f4f6;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <tr>
            <td style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); padding: 32px 24px; text-align: center;">
                <img src="{{ logo_url }}" alt="Averta" style="height: 40px; margin-bottom: 16px;">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">Redefinição de Senha</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 32px 24px;">
                <p style="font-size: 16px; color: #374151; margin: 0 0 16px;">Olá <strong>{{ to_name }}</strong>,</p>
                <p style="font-size: 16px; color: #374151; margin: 0 0 24px;">
                    Recebemos uma solicitação para redefinir sua senha na Averta.
                </p>

                <div style="background-color: #f0f9ff; border-radius: 8px; padding: 20px; margin-bottom: 24px; text-align: center;">
                    <p style="margin: 0 0 12px; font-size: 14px; color: #0369a1;">O link expira em {{ expires_hours }} horas</p>
                    <a href="{{ reset_url }}" style="display: inline-block; background-color: #1e3a8a; color: #ffffff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 16px;">
                        Redefinir Senha
                    </a>
                </div>

                <p style="font-size: 13px; color: #9ca3af; margin: 0;">
                    Se você não solicitou isso, ignore este e-mail. Sua senha permanecerá inalterada.
                </p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f9fafb; padding: 24px; text-align: center; border-top: 1px solid #e5e7eb;">
                <p style="font-size: 12px; color: #9ca3af; margin: 0;">© 2024 Averta. Todos os direitos reservados.</p>
            </td>
        </tr>
    </table>
</body>
</html>
