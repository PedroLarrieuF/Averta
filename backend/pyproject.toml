[tool.poetry]
name = "averta-backend"
version = "1.0.0"
description = "Averta SaaS - Freight Audit with Success-Based Billing"
authors = ["Averta Team <dev@averta.com.br>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
pydantic-extra-types = "^2.4.0"
prisma = "^0.12.0"
redis = "^5.0.0"
celery = "^5.3.0"
flower = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
sendgrid = "^6.10.0"
jinja2 = "^3.1.0"
lxml = "^5.0.0"
reportlab = "^4.0.0"
openpyxl = "^3.1.0"
boto3 = "^1.34.0"
minio = "^7.2.0"
structlog = "^24.1.0"
python-json-logger = "^2.0.0"
httpx = "^0.26.0"
tenacity = "^8.2.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
ruff = "^0.2.0"
mypy = "^1.8.0"
types-requests = "^2.31.0"
types-redis = "^4.6.0"
types-passlib = "^1.7.0"
pre-commit = "^3.6.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
mkdocstrings-python = "^1.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused function arguments (common in FastAPI)
    "ARG002", # unused method arguments (common in FastAPI)
]
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.poetry.scripts]
start = "uvicorn app.main:app --reload"
worker = "celery -A app.core.celery_app worker --loglevel=info"
beat = "celery -A app.core.celery_app beat --loglevel=info"
flower = "celery -A app.core.celery_app flower --port=5555"
lint = "ruff check app tests"
format = "ruff format app tests"
typecheck = "mypy app"
test = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=app --cov-report=term-missing"
db-push = "prisma db push"
db-generate = "prisma generate"
db-studio = "prisma studio"