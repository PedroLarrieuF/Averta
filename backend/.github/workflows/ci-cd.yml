name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  # Trivy severity thresholds
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_EXIT_CODE: 1
  AWS_REGION: us-east-1
  SECRETS_PREFIX: averta

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: false

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run linting (ruff)
        run: |
          poetry run ruff check app tests
          poetry run ruff format --check app tests

      - name: Run type checking (mypy)
        run: poetry run mypy app

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --fail --no-verification

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          vuln-type: 'os,library'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  sbom-generate:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sbom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sbom-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Attach SBOM to container image
        uses: anchore/sbom-action/attach@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sbom-${{ github.sha }}
          sbom-file: sbom.spdx.json

      - name: Sign SBOM with cosign (keyless)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign SBOM
        run: |
          cosign sign-blob \
            --yes \
            --type spdx \
            sbom.spdx.json

  build-and-push:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, sbom-generate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image with cosign (keyless)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --annotations "git.sha=${{ github.sha }}" \
            --annotations "git.ref=${{ github.ref }}" \
            ${{ steps.meta.outputs.tags }}

      - name: Verify signatures
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            ${{ steps.meta.outputs.tags }}

  fetch-secrets:
    name: Fetch Secrets from AWS Secrets Manager
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    outputs:
      database_url: ${{ steps.set-secrets.outputs.database_url }}
      redis_url: ${{ steps.set-secrets.outputs.redis_url }}
      s3_endpoint: ${{ steps.set-secrets.outputs.s3_endpoint }}
      s3_access_key: ${{ steps.set-secrets.outputs.s3_access_key }}
      s3_secret_key: ${{ steps.set-secrets.outputs.s3_secret_key }}
      s3_bucket: ${{ steps.set-secrets.outputs.s3_bucket }}
      s3_region: ${{ steps.set-secrets.outputs.s3_region }}
      jwt_secret_key: ${{ steps.set-secrets.outputs.jwt_secret_key }}
      jwt_refresh_secret_key: ${{ steps.set-secrets.outputs.jwt_refresh_secret_key }}
      jwt_algorithm: ${{ steps.set-secrets.outputs.jwt_algorithm }}
      sendgrid_api_key: ${{ steps.set-secrets.outputs.sendgrid_api_key }}
      sendgrid_from_email: ${{ steps.set-secrets.outputs.sendgrid_from_email }}
      sendgrid_from_name: ${{ steps.set-secrets.outputs.sendgrid_from_name }}
      environment: ${{ steps.set-secrets.outputs.environment }}
      log_level: ${{ steps.set-secrets.outputs.log_level }}
      cors_origins: ${{ steps.set-secrets.outputs.cors_origins }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Fetch All Secrets
        id: fetch-secrets
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          PREFIX: ${{ env.SECRETS_PREFIX }}
        run: |
          SECRET_KEYS=("database" "redis" "minio" "jwt" "sendgrid" "app")
          ALL_SECRETS="{}"

          for KEY in "${SECRET_KEYS[@]}"; do
            SECRET_NAME="${PREFIX}/${ENVIRONMENT}/${KEY}"
            echo "Fetching ${SECRET_NAME}..."

            SECRET_VALUE=$(aws secretsmanager get-secret-value \
              --secret-id "$SECRET_NAME" \
              --region "${AWS_REGION}" \
              --query 'SecretString' \
              --output text 2>/dev/null || echo "null")

            if [[ "$SECRET_VALUE" != "null" && -n "$SECRET_VALUE" ]]; then
              ALL_SECRETS=$(echo "$ALL_SECRETS" | jq --arg key "$KEY" --argjson val "$SECRET_VALUE" '. + {($key): $val}')
              echo "  ✓ Fetched ${KEY}"
            else
              echo "  ✗ ${KEY} not found"
            fi
          done

          echo "all_secrets<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL_SECRETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Parse and Set Secret Outputs
        id: set-secrets
        run: |
          SECRETS="${{ steps.fetch-secrets.outputs.all_secrets }}"

          # Database
          DB_HOST=$(echo "$SECRETS" | jq -r '.database.host // ""')
          DB_PORT=$(echo "$SECRETS" | jq -r '.database.port // 5432')
          DB_USER=$(echo "$SECRETS" | jq -r '.database.username // ""')
          DB_PASS=$(echo "$SECRETS" | jq -r '.database.password // ""')
          DB_NAME=$(echo "$SECRETS" | jq -r '.database.dbname // "averta"')

          if [[ -n "$DB_HOST" && -n "$DB_USER" && -n "$DB_PASS" ]]; then
            echo "database_url=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}" >> $GITHUB_OUTPUT
          fi

          # Redis
          REDIS_HOST=$(echo "$SECRETS" | jq -r '.redis.host // ""')
          REDIS_PORT=$(echo "$SECRETS" | jq -r '.redis.port // 6379')
          REDIS_PASS=$(echo "$SECRETS" | jq -r '.redis.password // ""')

          if [[ -n "$REDIS_HOST" ]]; then
            if [[ -n "$REDIS_PASS" ]]; then
              echo "redis_url=redis://:${REDIS_PASS}@${REDIS_HOST}:${REDIS_PORT}/0" >> $GITHUB_OUTPUT
            else
              echo "redis_url=redis://${REDIS_HOST}:${REDIS_PORT}/0" >> $GITHUB_OUTPUT
            fi
          fi

          # MinIO/S3
          echo "s3_endpoint=$(echo "$SECRETS" | jq -r '.minio.endpoint // ""')" >> $GITHUB_OUTPUT
          echo "s3_access_key=$(echo "$SECRETS" | jq -r '.minio.access_key // ""')" >> $GITHUB_OUTPUT
          echo "s3_secret_key=$(echo "$SECRETS" | jq -r '.minio.secret_key // ""')" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(echo "$SECRETS" | jq -r '.minio.bucket // "averta-documents"')" >> $GITHUB_OUTPUT
          echo "s3_region=$(echo "$SECRETS" | jq -r '.minio.region // "us-east-1"')" >> $GITHUB_OUTPUT

          # JWT
          echo "jwt_secret_key=$(echo "$SECRETS" | jq -r '.jwt.secret_key // ""')" >> $GITHUB_OUTPUT
          echo "jwt_refresh_secret_key=$(echo "$SECRETS" | jq -r '.jwt.refresh_secret_key // ""')" >> $GITHUB_OUTPUT
          echo "jwt_algorithm=$(echo "$SECRETS" | jq -r '.jwt.algorithm // "HS256"')" >> $GITHUB_OUTPUT

          # SendGrid
          echo "sendgrid_api_key=$(echo "$SECRETS" | jq -r '.sendgrid.api_key // ""')" >> $GITHUB_OUTPUT
          echo "sendgrid_from_email=$(echo "$SECRETS" | jq -r '.sendgrid.from_email // ""')" >> $GITHUB_OUTPUT
          echo "sendgrid_from_name=$(echo "$SECRETS" | jq -r '.sendgrid.from_name // ""')" >> $GITHUB_OUTPUT

          # App Config
          echo "environment=$(echo "$SECRETS" | jq -r '.app.environment // "production"')" >> $GITHUB_OUTPUT
          echo "log_level=$(echo "$SECRETS" | jq -r '.app.log_level // "info"')" >> $GITHUB_OUTPUT
          echo "cors_origins=$(echo "$SECRETS" | jq -r '.app.cors_origins // [] | @json')" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, fetch-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Staging (ECS)
        env:
          DATABASE_URL: ${{ needs.fetch-secrets.outputs.database_url }}
          REDIS_URL: ${{ needs.fetch-secrets.outputs.redis_url }}
          S3_ENDPOINT: ${{ needs.fetch-secrets.outputs.s3_endpoint }}
          S3_ACCESS_KEY: ${{ needs.fetch-secrets.outputs.s3_access_key }}
          S3_SECRET_KEY: ${{ needs.fetch-secrets.outputs.s3_secret_key }}
          S3_BUCKET: ${{ needs.fetch-secrets.outputs.s3_bucket }}
          S3_REGION: ${{ needs.fetch-secrets.outputs.s3_region }}
          JWT_SECRET_KEY: ${{ needs.fetch-secrets.outputs.jwt_secret_key }}
          JWT_REFRESH_SECRET_KEY: ${{ needs.fetch-secrets.outputs.jwt_refresh_secret_key }}
          JWT_ALGORITHM: ${{ needs.fetch-secrets.outputs.jwt_algorithm }}
          SENDGRID_API_KEY: ${{ needs.fetch-secrets.outputs.sendgrid_api_key }}
          SENDGRID_FROM_EMAIL: ${{ needs.fetch-secrets.outputs.sendgrid_from_email }}
          SENDGRID_FROM_NAME: ${{ needs.fetch-secrets.outputs.sendgrid_from_name }}
          ENVIRONMENT: ${{ needs.fetch-secrets.outputs.environment }}
          LOG_LEVEL: ${{ needs.fetch-secrets.outputs.log_level }}
          CORS_ORIGINS: ${{ needs.fetch-secrets.outputs.cors_origins }}
        run: |
          echo "Deploying to staging with secrets from AWS Secrets Manager"
          # Example ECS deployment:
          # aws ecs update-service --cluster averta-staging --service backend --force-new-deployment
          # Or Terraform:
          # cd infra/environments/staging && terraform apply -auto-approve

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, fetch-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Production (ECS)
        env:
          DATABASE_URL: ${{ needs.fetch-secrets.outputs.database_url }}
          REDIS_URL: ${{ needs.fetch-secrets.outputs.redis_url }}
          S3_ENDPOINT: ${{ needs.fetch-secrets.outputs.s3_endpoint }}
          S3_ACCESS_KEY: ${{ needs.fetch-secrets.outputs.s3_access_key }}
          S3_SECRET_KEY: ${{ needs.fetch-secrets.outputs.s3_secret_key }}
          S3_BUCKET: ${{ needs.fetch-secrets.outputs.s3_bucket }}
          S3_REGION: ${{ needs.fetch-secrets.outputs.s3_region }}
          JWT_SECRET_KEY: ${{ needs.fetch-secrets.outputs.jwt_secret_key }}
          JWT_REFRESH_SECRET_KEY: ${{ needs.fetch-secrets.outputs.jwt_refresh_secret_key }}
          JWT_ALGORITHM: ${{ needs.fetch-secrets.outputs.jwt_algorithm }}
          SENDGRID_API_KEY: ${{ needs.fetch-secrets.outputs.sendgrid_api_key }}
          SENDGRID_FROM_EMAIL: ${{ needs.fetch-secrets.outputs.sendgrid_from_email }}
          SENDGRID_FROM_NAME: ${{ needs.fetch-secrets.outputs.sendgrid_from_name }}
          ENVIRONMENT: ${{ needs.fetch-secrets.outputs.environment }}
          LOG_LEVEL: ${{ needs.fetch-secrets.outputs.log_level }}
          CORS_ORIGINS: ${{ needs.fetch-secrets.outputs.cors_origins }}
        run: |
          echo "Deploying to production with secrets from AWS Secrets Manager"
          # Example ECS deployment:
          # aws ecs update-service --cluster averta-prod --service backend --force-new-deployment
          # Or Terraform:
          # cd infra/environments/production && terraform apply -auto-approve

  notify:
    name: Pipeline Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, sbom-generate, build-and-push, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Pipeline completed with status: ${{ job.status }}"
          # Add Slack/Discord/Email notification here