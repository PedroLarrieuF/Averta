# ============================================
# REGIÕES E PRIORIDADES
# ============================================
regions:
  Sudeste:
    states: ["SP", "RJ", "MG", "ES"]
    priority: 1
    description: "Maior concentração industrial e comercial do país"

  Sul:
    states: ["PR", "SC", "RS"]
    priority: 1
    description: "Forte base industrial, agroindústria e logística"

  Centro-Oeste:
    states: ["DF", "GO", "MT", "MS"]
    priority: 2
    description: "Agronegócio, logística e distribuição"

  Nordeste:
    states: ["BA", "PE", "CE", "MA", "PB", "RN", "AL", "SE", "PI"]
    priority: 2
    description: "Crescimento industrial, portos e energias renováveis"

  Norte:
    states: ["AM", "PA", "RO", "AC", "RR", "AP", "TO"]
    priority: 3
    description: "Zona Franca, mineração, agronegócio e logística fluvial"

# ============================================
# CONFIGURAÇÕES DE GERAÇÃO DE QUERIES
# ============================================
query_generation:
  # Máximo de queries por execução
  max_queries_per_run: 200

  # Queries por estado (base)
  queries_per_state_base: 5

  # Multiplicador por prioridade
  priority_multiplier:
    "1": 3  # Prioridade 1 = 3x mais queries
    "2": 2  # Prioridade 2 = 2x mais queries
    "3": 1  # Prioridade 3 = base

  # Queries por cidade (para cidades principais)
  queries_per_major_city: 2

  # Queries por polo industrial
  queries_per_industrial_pole: 3

  # Templates a usar
  templates:
    - "{segment} em {city} {state}"
    - "{segment} {city} {state}"
    - "distribuidora {segment} {city} {state}"
    - "atacadista {segment} {city} {state}"
    - "indústria {segment} {city} {state}"
    - "fabricante {segment} {city} {state}"
    - "empresa {segment} {city} {state}"
    - "{segment} atacado {city} {state}"
    - "{segment} distribuição {city} {state}"
    - "fornecedor {segment} {city} {state}"
    - "comércio {segment} {city} {state}"
    - "varejo {segment} {city} {state}"

  # Templates para polos industriais
  industrial_templates:
    - "empresas no polo industrial {pole} {state}"
    - "indústrias no {pole} {state}"
    - "distribuidoras no {pole} {state}"
    - "atacadistas no {pole} {state}"
    - "logística no {pole} {state}"
    - "transportadoras no {pole} {state}"

  # Filtros de exclusão
  exclude_keywords:
    - "residencial"
    - "residencia"
    - "apartamento"
    - "casa"
    - "condomínio"
    - "condominio"
    - "pessoa física"
    - "pessoa fisica"
    - "autônomo"
    - "autonomo"
    - "freelancer"
    - "MEI"
    - "microempreendedor"