# ============================================
# CONFIGURAÇÕES DE LOGGING
# ============================================
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  rotation: "10 MB"
  retention: "30 days"
  compression: "zip"
  file: "logs/automation.log"
  console: true

# ============================================
# CONFIGURAÇÕES DE PERFORMANCE
# ============================================
performance:
  # Batch sizes
  batch_size_queries: 50
  batch_size_scrape: 100
  batch_size_qualify: 500
  batch_size_export: 1000

  # Paralelismo
  max_workers_scraper: 4
  max_workers_qualification: 8
  max_workers_enrichment: 4

  # Timeouts
  scraper_timeout_seconds: 300
  enrichment_timeout_seconds: 60
  api_timeout_seconds: 30

  # Retry
  max_retries: 3
  retry_delay_seconds: 5
  retry_backoff_factor: 2

# ============================================
# CONFIGURAÇÕES WHATSAPP BUSINESS
# ============================================
whatsapp:
  # Habilitar integração WhatsApp
  enabled: false  # Habilitar quando credenciais estiverem configuradas

  # Provedor principal
  provider: "cloud_api"  # cloud_api | web_automation | on_premise

  # Meta WhatsApp Business Cloud API
  cloud_api:
    api_version: "v18.0"
    business_account_id: ""  # ID da conta de negócios Meta
    phone_number_id: ""      # ID do número de telefone WhatsApp
    access_token: ""         # Token de acesso permanente (System User)
    webhook_verify_token: "" # Token para verificação do webhook
    app_secret: ""           # App Secret (para validar assinaturas webhook)

  # On-Premise WhatsApp Business API (opcional)
  on_premise:
    base_url: "https://your-whatsapp-api.com"
    username: ""
    password: ""

  # Web Automation (fallback via Playwright)
  web_automation:
    headless: true
    session_file: "whatsapp_session.json"
    qr_timeout_seconds: 120
    login_timeout_seconds: 180
    message_delay_seconds: 2
    use_persistent_context: true

  # Templates aprovados no Meta
  templates:
    - name: "initial_contact"
      language: "pt_BR"
      category: "MARKETING"
      header_text: "Oportunidade para {{company_name}}"
