# Configurações Principais da Automação de Leads Averta

# ============================================
# CONFIGURAÇÕES GERAIS
# ============================================
general:
  project_name: "Averta Lead Generation"
  version: "1.0.0"
  timezone: "America/Sao_Paulo"
  language: "pt-BR"

  # Modo de execução
  mode: "full"  # full | generate-queries | scrape | qualify-export | continuous

  # Execução contínua
  continuous:
    enabled: false
    interval_hours: 24
    max_runs_per_day: 1

  # Diretórios
  paths:
    data_dir: "data"
    queries_dir: "queries/generated"
    output_dir: "output"
    logs_dir: "logs"
    cache_dir: "data/cache"
    master_db: "data/master.db"

# ============================================
# CONFIGURAÇÕES DO SCRAPER (google-maps-scraper)
# ============================================
scraper:
  # Modo de execução do scraper
  execution_mode: "binary"  # binary | rest-api | docker

  # Caminho do binário (se execution_mode: binary)
  binary_path: "./google-maps-scraper"  # Será resolvido automaticamente

  # REST API (se execution_mode: rest-api)
  rest_api:
    base_url: "http://localhost:8080"
    timeout_seconds: 300

  # Docker (se execution_mode: docker)
  docker:
    image: "gosom/google-maps-scraper:latest"
    volumes:
      - "./data/cache:/opt"
      - "./queries/generated:/queries:ro"
      - "./output:/out"

  # Parâmetros de scraping
  params:
    depth: 2                    # Profundidade de scroll (1-3)
    concurrency: 4              # Jobs paralelos (CPU/2 recomendado)
    fast_mode: false            # Modo rápido (≤21 resultados/query)
    extract_emails: true        # Extrair emails dos sites
    extra_reviews: false        # Reviews extras (requer JSON)
    exit_on_inactivity: "5m"    # Timeout de inatividade
    grid_cell_km: 10            # Tamanho da célula do grid (km)
    proxies: []                 # Lista de proxies (opcional)
    user_agent: ""              # User agent customizado (opcional)

  # Limites
  limits:
    max_results_per_query: 500
    max_queries_per_run: 200
    max_total_results: 50000
    rate_limit_per_minute: 30

  # Output do scraper
  output_format: "json"  # json | csv

# ============================================
# CONFIGURAÇÕES DE QUALIFICAÇÃO (ICP)
# ============================================
qualification:
  # Pesos do scoring (devem somar 1.0)
  weights:
    operational_fit: 0.40    # Fit Operacional
    commercial_fit: 0.35     # Fit Comercial
    data_confidence: 0.25    # Confiança dos Dados

  # Thresholds de classificação
  thresholds:
    A_min: 85   # Excelente
    B_min: 70   # Qualificado
    C_min: 50   # Precisa enriquecimento
    # D: < 50

  # Critérios de Fit Operacional (40%)
  operational_fit:
    keywords_embarcadora:
      weight: 0.30
      terms:
        - "transportadora"
        - "fretes"
        - "logística"
        - "distribuição"
        - "expedição"
        - "embarcador"
        - "carga"
        - "entrega"
        - "coleta"
        - "roteirização"
    keywords_volume:
      weight: 0.25
      terms:
        - "frota"
        - "veículos"
        - "caminhões"
        - "carretas"
        - "volume"
        - "toneladas"
        - "paletes"
        - "containers"
    keywords_estrutura:
      weight: 0.25
      terms:
        - "filial"
        - "centro de distribuição"
        - "cd "
        - "armazém"
        - "depósito"
        - "cross docking"
        - "última milha"
    keywords_recorrencia:
      weight: 0.20
      terms:
        - "regular"
        - "diário"
        - "semanal"
        - "mensal"
        - "contrato"
        - "terceiriz"

  # Critérios de Fit Comercial (35%)
  commercial_fit:
    porte_keywords:
      weight: 0.30
      grande:
        - "s.a."
        - "s/a"
        - "ltda grande"
        - "grupo"
        - "holding"
        - "conglomerado"
      medio:
        - "ltda"
        - "me "
        - "eireli"
        - "industrial"
        - "comercial"
      pequeno:
        - "mei"
        - "micro"
        - "pequeno"
    estrutura_keywords:
      weight: 0.25
      terms:
        - "matriz"
        - "sede"
        - "corporativo"
        - "administrativo"
        - "financeiro"
        - "compras"
        - "suprimentos"
    decisores_keywords:
      weight: 0.25
      terms:
        - "diretor"
        - "gerente"
        - "coordenador"
        - "supervisor"
        - "logística"
        - "transportes"
        - "supply chain"
        - "operations"
    canais_institucionais:
      weight: 0.20
      terms:
        - "site"
        - "linkedin"
        - "institucional"
        - "contato"
        - "fale conosco"

  # Critérios de Confiança dos Dados (25%)
  data_confidence:
    site_verificado:
      weight: 0.35
    telefone_verificado:
      weight: 0.25
    segmento_confirmado:
      weight: 0.20
    linkedin_verificavel:
      weight: 0.10
    fontes_registradas:
      weight: 0.10

