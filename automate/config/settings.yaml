# ============================================
# CONFIGURAÇÕES DE EXPORT
# ============================================
export:
  # Formato de saída
  format: "xlsx"  # xlsx | csv | both

  # Arquivos de saída
  files:
    leads_ab: "output/leads_A_B.xlsx"
    leads_c: "output/leads_C.xlsx"
    daily_report: "output/reports/daily_{date}.xlsx"
    whatsapp_ready: "output/whatsapp_ready/leads_whatsapp_{date}.xlsx"
    coverage_report: "output/reports/coverage_{date}.xlsx"
    decision_makers_report: "output/reports/decision_makers_{date}.xlsx"

  # Colunas para leads A/B (consolidado)
  leads_ab_columns:
    - "id"
    - "classification"  # A ou B
    - "score"
    - "company_name"
    - "trade_name"
    - "segment"
    - "address"
    - "city"
    - "state"
    - "postal_code"
    - "phone"
    - "phone_verified"
    - "whatsapp"
