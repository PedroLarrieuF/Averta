      respect_opt_out: true
      opt_out_keywords:
        - "não quero"
        - "nao quero"
        - "parar"
        - "cancelar"
        - "remover"
        - "não tenho interesse"
        - "nao tenho interesse"
        - "descadastrar"
        - "opt out"
        - "unsubscribe"

  # Configurações de envio gerais
  sending:
    # Rate limiting
    rate_limit_per_minute: 20
    rate_limit_per_hour: 500
    rate_limit_per_day: 2000

    # Opt-in
    opt_in_required: true
    opt_in_method: "explicit"  # explicit | inferred | template_reply

    # Horário comercial
    business_hours_only: true
    business_hours_start: "08:00"
    business_hours_end: "18:00"
    timezone: "America/Sao_Paulo"

    # Personalização
    use_personalization: true
    fallback_to_generic: true
    max_custom_variables: 20

    # Mídia
    allow_media: false
    media_types: ["image", "document"]
    max_media_size_mb: 16

    # Tracking
    track_delivery: true
    track_read: true
    track_clicks: false

    # Retry
    max_retries: 3
    retry_delay_seconds: 30
    retry_backoff_factor: 2

