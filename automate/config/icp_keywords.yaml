# ============================================
# CONFIGURAÇÕES DE ENRIQUECIMENTO
# ============================================
enrichment:
  # Fontes de enriquecimento
  sources:
    - "website"
    - "linkedin"
    - "google_search"
    - "cnpj_biz"  # Receita Federal / CNPJ
    - "telefone"
    - "email_hunter"

  # Campos a enriquecer
  target_fields:
    - "email"
    - "phone"
    - "whatsapp"
    - "linkedin"
    - "decision_makers"
    - "company_size"
    - "revenue_range"
    - "employee_count"
    - "technologies"
    - "social_media"

  # Prioridade de enriquecimento
  priority_rules:
    high:
      - classification: "C"
        missing_fields: ["email", "phone", "decision_makers"]
    medium:
      - classification: "B"
        missing_fields: ["decision_makers", "whatsapp"]
    low:
      - classification: "A"
        missing_fields: ["whatsapp", "linkedin"]

# ============================================
# TEMPLATES DE MENSAGEM WHATSAPP (FUTURO)
# ============================================
whatsapp_templates:
  initial_contact:
    - "Olá {name}, sou da Averta. Vi que a {company} atua com {segment} em {city}. Gostaria de apresentar nossa solução de gestão de fretes que reduz custos em até 30%. Podemos conversar?"
    - "Oi {name}, tudo bem? A Averta ajuda empresas como a {company} a otimizar a logística de transporte. Temos cases no segmento de {segment} com excelente resultado. Tem 15 min essa semana?"

  follow_up:
    - "Oi {name}, passando para saber se teve chance de avaliar nossa proposta. A {company} pode economizar significativamente nos fretes. Vamos agendar?"
    - "Olá {name}, seguindo nosso papo sobre logística. Tenho um case similar à {company} que reduziu 25% no custo de frete. Quer ver os números?"

  value_proposition:
    - "Gestão completa de fretes: cotação, contratação, tracking e auditoria em uma plataforma"
    - "Redução de até 30% no custo logístico com nossa rede de transportadoras validadas"
    - "Visibilidade total da carga em tempo real + relatórios gerenciais automáticos"
    - "Integração com seu ERP/TMS via API - implementação em dias, não meses"