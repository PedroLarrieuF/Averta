# ============================================
# QUERIES BASE POR ESTADO/REGIÃO
# ============================================
base_queries_by_region:
  # Formato: "query_template" -> será preenchido com {city}, {state}, {segment}
  templates:
    - "{segment} em {city} {state}"
    - "{segment} {city} {state}"
    - "distribuidora {segment} {city} {state}"
    - "atacadista {segment} {city} {state}"
    - "indústria {segment} {city} {state}"
    - "fabricante {segment} {city} {state}"
    - "empresa {segment} {city} {state}"
    - "{segment} atacado {city} {state}"
    - "{segment} distribuição {city} {state}"
    - "fornecedor {segment} {city} {state}"
    - "comércio {segment} {city} {state}"
    - "varejo {segment} {city} {state}"

  # Queries específicas para polos industriais
  industrial_poles:
    - "empresas no polo industrial {pole} {state}"
    - "indústrias no {pole} {state}"
    - "distribuidoras no {pole} {state}"
    - "atacadistas no {pole} {state}"
    - "logística no {pole} {state}"
    - "transportadoras no {pole} {state}"

