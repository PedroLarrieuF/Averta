openapi: 3.1.0
info:
  title: AvertaSaaS API
  description: |
    API para o sistema de auditoria de frete AvertaSaaS.

    ## Autenticação

    A API usa autenticação via API Key. Inclua o header `X-API-Key` em todas as requisições:

    ```
    X-API-Key: avt_live_xxxxxxxxxxxxxxxx
    ```

    As chaves podem ser geradas no [Developer Portal](/developer/keys).

    ## Códigos de Erro

    | Código | Descrição |
    |--------|-----------|
    | 400 | Requisição inválida |
    | 401 | Não autenticado / API Key inválida |
    | 403 | Sem permissão para acessar o recurso |
    | 404 | Recurso não encontrado |
    | 422 | Erro de validação |
    | 500 | Erro interno do servidor |

    ## Rate Limiting

    - 1000 requisições por minuto por API Key
    - Headers de rate limit: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
  version: 1.0.0
  contact:
    name: AvertaSaaS Support
    email: suporte@avertasas.com.br
    url: https://avertasas.com.br

servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de desenvolvimento local
  - url: https://api.avertasas.com.br/api/v1
    description: Servidor de produção

security:
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: Autenticação e autorização
  - name: Documents
    description: Gestão de documentos fiscais
  - name: Discrepancies
    description: Discrepâncias de auditoria
  - name: Contests
    description: Contestações e negociações
  - name: Reports
    description: Relatórios e exportações
  - name: Settings
    description: Configurações da empresa
  - name: Clients
    description: Gestão de clientes
  - name: Carriers
    description: Gestão de transportadoras
  - name: Contracts
    description: Gestão de contratos e tabelas de frete
  - name: Webhooks
    description: Gerenciamento de webhooks

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key gerada no Developer Portal

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Dados de entrada inválidos"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            size:
              type: integer
              example: 20
            total:
              type: integer
              example: 150
            total_pages:
              type: integer
              example: 8

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registro de novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, company_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                full_name:
                  type: string
                company_name:
                  type: string
      responses:
        '201':
          description: Usuário criado com sucesso

  /auth/me:
    get:
      tags: [Auth]
      summary: Obter usuário atual
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Dados do usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /documents:
    get:
      tags: [Documents]
      summary: Listar documentos
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, PROCESSED, ERROR]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      tags: [Documents]
      summary: Upload de documento
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [NFE, CTE, MDFE, OTHER]
      responses:
        '201':
          description: Documento enviado para processamento

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Obter detalhes do documento
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do documento
        '404':
          description: Documento não encontrado

  /discrepancies:
    get:
      tags: [Discrepancies]
      summary: Listar discrepâncias
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, UNDER_REVIEW, RESOLVED, IGNORED]
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: carrier_id
          in: query
          schema:
            type: string
        - name: client_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de discrepâncias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /discrepancies/summary:
    get:
      tags: [Discrepancies]
      summary: Resumo de discrepâncias
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Resumo agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  by_status:
                    type: object
                  by_severity:
                    type: object
                  total_value:
                    type: number

  /contests:
    get:
      tags: [Contests]
      summary: Listar contestações
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SENT, NEGOTIATING, PAID, CLOSED, CANCELLED]
      responses:
        '200':
          description: Lista de contestações

    post:
      tags: [Contests]
      summary: Criar nova contestação
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discrepancy_ids, carrier_id]
              properties:
                discrepancy_ids:
                  type: array
                  items:
                    type: string
                carrier_id:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Contestação criada

  /contests/{id}:
    get:
      tags: [Contests]
      summary: Obter detalhes da contestação
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da contestação

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Dados do dashboard de relatórios
      security:
        - ApiKeyAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        '200':
          description: Dados do dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: object
                  charts:
                    type: object

  /reports/pdf:
    get:
      tags: [Reports]
      summary: Exportar relatório em PDF
      security:
        - ApiKeyAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [A4, Letter]
            default: A4
      responses:
        '200':
          description: Arquivo PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /reports/excel:
    get:
      tags: [Reports]
      summary: Exportar relatório em Excel
      security:
        - ApiKeyAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Arquivo Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /clients:
    get:
      tags: [Clients]
      summary: Listar clientes
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de clientes

  /carriers:
    get:
      tags: [Carriers]
      summary: Listar transportadoras
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de transportadoras

  /contracts:
    get:
      tags: [Contracts]
      summary: Listar contratos
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de contratos

  /webhooks:
    get:
      tags: [Webhooks]
      summary: Listar webhooks
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de webhooks

    post:
      tags: [Webhooks]
      summary: Criar webhook
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                secret:
                  type: string
      responses:
        '201':
          description: Webhook criado

  /webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Excluir webhook
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook excluído

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, AUDITOR, CLIENT]
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time